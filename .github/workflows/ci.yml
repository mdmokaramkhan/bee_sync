name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.10

jobs:
  dart:
    name: Dart (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Publish dry run
        run: flutter pub publish --dry-run

  android:
    name: Android (Robolectric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Building the example generates the Gradle wrapper the tests need.
      - name: Build example
        working-directory: example
        run: flutter build apk --debug
      - name: Native tests
        working-directory: example/android
        run: ./gradlew :bee_sync:testDebugUnitTest

  ios:
    name: iOS (XCTest)
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      # The runner's default Xcode can be older than what current plugin
      # releases need (e.g. connectivity_plus uses iOS 26 SDK APIs).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build example
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Native tests
        working-directory: example/ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime
                     for d in ds if d['name'].startswith('iPhone')))")
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$SIM" -only-testing:RunnerTests
