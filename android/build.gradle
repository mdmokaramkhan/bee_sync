group = "dev.beesync.bee_sync"
version = "0.3.2"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "dev.beesync.bee_sync"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation("androidx.work:work-runtime:2.10.0")

        testImplementation("junit:junit:4.13.2")
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit")
        testImplementation("org.robolectric:robolectric:4.14.1")
        testImplementation("androidx.test:core:1.6.1")
        testImplementation("androidx.work:work-testing:2.10.0")
        testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Tests read the shared spec/ files relative to the plugin root.
            systemProperty "beesync.specDir", file("../spec").absolutePath
            // The JDK's HttpURLConnection silently re-sends a POST once after a
            // dropped connection; turn that off so fixtures see one request.
            systemProperty "sun.net.http.retryPost", "false"

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
